name: Palabras UI and vocabulary checks
on:
  push:
    branches: [main, feat/robot-mascot-auto-resolver]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dictionary.js
          node --check vocabulary.js
      - name: Vocabulary tests
        run: node --test tests/dictionary.test.js tests/vocabulary.test.js
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Classroom browser tests
        run: node tests/ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
